<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>조각 · 기억을 꿰매는 조각보</title>
    <meta name="description" content="사진을 천 조각으로 물들여 손으로 꿰매는 조각보 앨범" />
    <link rel="stylesheet" href="/src/debug/style.css" />
    <link rel="stylesheet" href="/src/quilt/style.css" />
    <link rel="stylesheet" href="/src/demo/style.css" />
  </head>
  <body>
    <main class="page demo">
      <header>
        <h1>조각 <span>기억을 꿰매는 조각보</span></h1>
        <p class="lede">
          인스타그램 피드는 모든 순간을 같은 크기의 칸으로 납작하게 만듭니다.
          그 칸에서 기억을 꺼내 색과 결만 남긴 천으로 물들이고, 기억의 무게만큼 잘라 손으로 다시 잇습니다.
        </p>
      </header>
      <figure class="quilt" id="quilt">
        <canvas id="canvas" aria-label="사진으로 물들인 천 조각들을 이은 조각보"></canvas>
        <figcaption id="sew-status" aria-live="polite">조각보를 펼치는 중</figcaption>
        <p class="hint">조각 위에 마우스를 올리거나 길게 누르면 천 너머로 원래 사진이 비쳐요.</p>
        <div class="hands"><button type="button" id="light"></button><button type="button" id="save" disabled></button></div>
      </figure>
      <nav class="next">
        <a class="thread-link" href="./quilt.html">내 인스타그램 캡처로 짓기</a>
        <a class="thread-link quiet" href="./debug.html">캡처 자르기 확인 화면</a>
      </nav>
    </main>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
