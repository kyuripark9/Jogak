<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>조각 · 조각보 짓기</title>
    <link rel="stylesheet" href="/src/debug/style.css" />
    <link rel="stylesheet" href="/src/quilt/style.css" />
  </head>
  <body>
    <main class="page">
      <h1>조각보 짓기 <span>조각 · 2단계</span></h1>
      <p class="lede">
        잘라 낸 사진마다 대표 색과 결만 남겨 천 조각으로 물들이고, 기억의 무게만큼 크기를 나눠 한 장으로 잇습니다.
      </p>
      <section class="intake" id="drop">
        <label class="pick">
          <input id="files" type="file" multiple accept="image/*,application/pdf,.pdf" />
          <span>캡처 올리기</span>
        </label>
        <p class="hint">1단계와 같은 캡처를 그대로 쓸 수 있어요.</p>
        <div class="samples">
          <button type="button" data-sample="natural">예시: 장면 사진 36장</button>
          <label class="pin">고정 게시물 <select id="pinned"><option value="0">없음</option><option value="1">맨 앞 1개</option><option value="2">맨 앞 2개</option><option value="3">맨 앞 3개</option></select></label>
          <button type="button" id="reseed" hidden>다시 자르기</button>
        </div>
      </section>
      <p class="progress" id="progress" aria-live="polite"></p>
      <figure class="quilt" id="quilt" hidden><canvas id="canvas"></canvas></figure>
      <section id="ledger" hidden></section>
    </main>
    <script type="module" src="/src/quilt/main.ts"></script>
  </body>
</html>
