<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>조각 · 캡처 자르기 확인</title>
    <link rel="stylesheet" href="/src/debug/style.css" />
  </head>
  <body>
    <main class="page" id="app">
      <h1>캡처 자르기 확인 <span>조각 · 1단계</span></h1>
      <p class="lede">
        인스타그램 프로필 캡처를 올리면 칸 사이 여백선을 찾아 게시물을 한 칸씩 잘라 냅니다.
        사진은 이 브라우저 안에서만 읽고 어디로도 보내지 않아요.
      </p>

      <section class="intake" id="drop">
        <label class="pick">
          <input id="files" type="file" multiple accept="image/*,application/pdf,.pdf" />
          <span>캡처 올리기</span>
        </label>
        <p class="hint">스크린샷 여러 장 · 스크롤 캡처 긴 이미지 · 사파리 전체 페이지 PDF</p>
        <div class="samples">
          <button type="button" data-sample="shots">예시: 스크린샷 5장 (4:5 칸)</button>
          <button type="button" data-sample="long">예시: 긴 스크롤 캡처 (3:4 칸, 다크 모드)</button>
        </div>
      </section>

      <p class="progress" id="progress" aria-live="polite"></p>
      <section id="summary" hidden></section>
      <section id="sources"></section>
      <section id="pieces" hidden></section>
    </main>
    <script type="module" src="/src/debug/main.ts"></script>
  </body>
</html>
